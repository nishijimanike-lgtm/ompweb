[package]
name = "ompweb-desktop"
version = "0.1.0"
description = "Desktop client for ompweb"
authors = ["kahme247"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "ompweb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
open = "5"
ureq = "2"
